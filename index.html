<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>LOCAL ENVIRONMENT MONITOR</title>

<script src="/chart.min.js"></script>

<style>

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
}

/* =========================
   HEADER
========================= */

.header{
  width:100%;
  height:70px;
  background:#ffffff;
  border-bottom:1px solid #ccc;

  display:flex;
  align-items:center;
  justify-content:space-between;

  box-sizing:border-box;
  padding:10px 20px;
}

.title{
  font-size:28px;
  font-weight:bold;
}

.controls{
  display:flex;
  gap:10px;
}

button{
  padding:8px 16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
  background:#e0e0e0;
}

button.active{
  background:#007bff;
  color:#fff;
}

/* =========================
   FILTER AREA
========================= */

.filter-area{
  width:100%;
  background:#fff;
  padding:10px 20px;
  box-sizing:border-box;
  border-bottom:1px solid #ccc;

  display:flex;
  align-items:center;
  gap:10px;
}

.filter-area input{
  padding:5px;
  font-size:14px;
}

/* =========================
   CHART AREA
========================= */

.chart-wrapper{
  width:100%;
  height:58vh;
  padding:10px;
  box-sizing:border-box;
}

.chart-box{
  width:100%;
  height:100%;
  background:#fff;
  border:1px solid #ccc;
  border-radius:8px;
  padding:10px;
  box-sizing:border-box;
}

/* =========================
   TABLE AREA
========================= */

.table-wrapper{
  width:100%;
  height:28vh;
  overflow:auto;
  padding:10px;
  box-sizing:border-box;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  table-layout:fixed;
}

thead th{
  position:sticky;
  top:0;
  background:#eeeeee;
  z-index:1;
}

th,td{
  border:1px solid #444;
  text-align:center;
  padding:5px;
  font-size:14px;
}

tr:nth-child(even){
  background:#fafafa;
}

/* =========================
   COLUMN WIDTH
========================= */

th:nth-child(1),td:nth-child(1){width:130px;}
th:nth-child(2),td:nth-child(2){width:90px;}
th:nth-child(3),td:nth-child(3){width:80px;}
th:nth-child(4),td:nth-child(4){width:90px;}
th:nth-child(5),td:nth-child(5){width:90px;}
th:nth-child(6),td:nth-child(6){width:100px;}
th:nth-child(7),td:nth-child(7){width:80px;}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="header">

  <div class="title">
    ローカル環境モニター
  </div>

  <div class="controls">
    <button id="btn_temp" onclick="changeType('temp')">
      温度(℃)
    </button>

    <button id="btn_hum" onclick="changeType('hum')">
      湿度(%)
    </button>

    <button id="btn_pres" onclick="changeType('pres')">
      気圧(hPa)
    </button>
  </div>

</div>

<!-- =========================
     FILTER
========================= -->

<div class="filter-area">

  開始:

  <input type="datetime-local" id="start">

  終了:

  <input type="datetime-local" id="end">

  <button onclick="applyFilter()"
          style="background:#28a745;color:white;">
    適用
  </button>

</div>

<!-- =========================
     CHART
========================= -->

<div class="chart-wrapper">

  <div class="chart-box">

    <canvas id="chart"></canvas>

  </div>

</div>

<!-- =========================
     TABLE
========================= -->

<div class="table-wrapper">

<table>

<thead>
<tr>
  <th>Date</th>
  <th>Time</th>
  <th>Device</th>
  <th>Temp(℃)</th>
  <th>Hum(%)</th>
  <th>Pres(hPa)</th>
  <th>RSSI</th>
</tr>
</thead>

<tbody id="tbl">
</tbody>

</table>

</div>

<script>

/* ==========================================
   GLOBAL
========================================== */

let chart = null;
let currentType = 'temp';
let fullData = [];

/* ==========================================
   DEVICE COLOR
========================================== */

function getColor(dev){

  let hash = 0;

  for(let i=0;i<dev.length;i++){
    hash = dev.charCodeAt(i) +
           ((hash << 5) - hash);
  }

  return `hsl(${Math.abs(hash)%360},70%,50%)`;
}

/* ==========================================
   PARSE TIMESTAMP
========================================== */

function parseTS(dateStr,timeStr){

  const d = dateStr.split('/');
  const t = timeStr.split(':');

  return new Date(
    Number(d[0]),
    Number(d[1])-1,
    Number(d[2]),
    Number(t[0]),
    Number(t[1]),
    Number(t[2])
  ).getTime();
}

/* ==========================================
   LOAD JSON
========================================== */

async function loadData(){

  try{

    const res = await fetch('/data');

    fullData =
      (await res.json())

      .map(d=>({
        ...d,
        _ts:parseTS(d.date,d.time)
      }))

      .sort((a,b)=>a._ts-b._ts);

    applyFilter();

  }catch(e){

    console.error(e);
  }
}

/* ==========================================
   FILTER
========================================== */

function applyFilter(){

  const s =
    document.getElementById('start').value;

  const e =
    document.getElementById('end').value;

  const startTime =
    s ? new Date(s).getTime() : 0;

  const endTime =
    e ? new Date(e).getTime() : Infinity;

  let filtered =
    fullData.filter(d=>
      d._ts >= startTime &&
      d._ts <= endTime
    );

  filtered = filtered.slice(-3000);

  updateTable(filtered);

  updateChart(filtered);
}

/* ==========================================
   TABLE
========================================== */

function updateTable(data){

  const tbody =
    document.getElementById('tbl');

  let html = '';

  data.slice().reverse().forEach(d=>{

    html += `
    <tr>
      <td>${d.date}</td>
      <td>${d.time}</td>
      <td>${d.device}</td>
      <td>${Number(d.temp).toFixed(2)}</td>
      <td>${Number(d.hum).toFixed(2)}</td>
      <td>${Number(d.pres).toFixed(1)}</td>
      <td>${d.rssi ?? '-'}</td>
    </tr>
    `;
  });

  tbody.innerHTML = html;
}

/* ==========================================
   BUTTON
========================================== */

function changeType(type){

  currentType = type;

  applyFilter();
}

/* ==========================================
   CHART
========================================== */

function updateChart(data){

  ['temp','hum','pres'].forEach(t=>{

    document
      .getElementById('btn_'+t)
      .className =
        (t===currentType)
        ? 'active'
        : '';
  });

  if(chart){
    chart.destroy();
  }

  if(data.length===0){
    return;
  }

  const labelSet = new Set();

  const groups = {};

  data.forEach(d=>{

    const label =
      d.date.split('/').slice(1).join('/') +
      " " +
      d.time.slice(0,5);

    labelSet.add(label);

    if(!groups[d.device]){
      groups[d.device] = {
        vals:{}
      };
    }

    groups[d.device]
      .vals[label] =
        d[currentType];
  });

  const labels =
    Array.from(labelSet);

  const datasets =
    Object.keys(groups).map(dev=>({

      label:dev,

      data:labels.map(l=>
        groups[dev].vals[l] ?? null
      ),

      borderColor:getColor(dev),

      backgroundColor:getColor(dev),

      borderWidth:2,

      tension:0.15,

      spanGaps:true,

      pointRadius:1

    }));

  chart = new Chart(

    document.getElementById('chart'),

    {
      type:'line',

      data:{
        labels:labels,
        datasets:datasets
      },

      options:{

        responsive:true,

        maintainAspectRatio:false,

        animation:false,

        interaction:{
          mode:'index',
          intersect:false
        },

        plugins:{
          legend:{
            display:true
          }
        },

        scales:{
          x:{
            ticks:{
              maxTicksLimit:20
            }
          }
        }
      }
    }
  );
}

/* ==========================================
   AUTO LOAD
========================================== */

loadData();

setInterval(loadData,60000);

</script>

</body>
</html>
