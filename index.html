<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CLOUD MONITOR (TOTAL SECURE)</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  html,body{margin:0;padding:0;height:100vh;overflow:hidden;font-family:sans-serif;background:#f0f2f5;}
  .header-row{display:grid;grid-template-columns: 1.2fr 1fr 2.1fr; align-items:center; height:6vh; padding:0 15px; background:#fff; border-bottom:1px solid #ccc;}
  h2{margin:0; font-size:24px; text-align:center;}
  .filter-box{font-size:14px; display:flex; gap:5px;}
  .filter-box input{font-size:14px; padding:2px; width:160px;}
  .controls{text-align:right; display:flex; align-items:center; justify-content:flex-end; gap:3px;}
  .mode-divider{width:1px; height:20px; background:#ccc; margin:0 8px;}
  button{margin:0 3px;padding:6px 15px;font-size:14px;cursor:pointer;border:1px solid #ccc;background:#fff;border-radius:4px;}
  button.active{background:#007bff;color:#fff;border-color:#0056b3;}
  .btn-toggle-auto { background:#e3f2fd; color:#0056b3; font-weight:bold; border-color:#b3e5fc; }
  
  /* 設定入力エリアのスタイル */
  .setup-overlay { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:9999; display:flex; justify-content:center; align-items:center; }
  .setup-box { background:#fff; padding:30px; border-radius:8px; width:450px; box-shadow:0 4px 15px rgba(0,0,0,0.3); }
  .setup-box h3 { margin-top:0; color:#333; }
  .setup-box label { display:block; margin:12px 0 4px; font-weight:bold; font-size:13px; }
  .setup-box input { width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px; font-family:monospace; }
  .setup-box button { width:100%; margin-top:20px; padding:10px; background:#007bff; color:#fff; border:none; font-weight:bold; font-size:15px; }

  #chart-container{position:relative; width:99vw; height:70vh; background:#fff; margin:5px auto; padding:10px; box-sizing:border-box; border:1px solid #ddd; border-radius:8px;}
  .table-outer{width:100%; display:flex; justify-content:center;}
  .table-wrapper{width:60%; height:22vh; overflow-y:auto; background:#fff; border:1px solid #333; border-radius:4px;}
  table{border-collapse:collapse; width:100%; table-layout:fixed;}
  thead th{position:sticky; top:0; background:#eee; z-index:1; border:1px solid #333; padding:4px;}
  td{border:1px solid #333; padding:3px; text-align:center; font-size:16px; height:35px;}
</style>
</head>
<body>

<div id="setup-screen" class="setup-overlay">
  <div class="setup-box">
    <h3>🔒 個人認証（Firebase接続設定）</h3>
    <p style="font-size:12px; color:#666; margin:0;">この設定はブラウザに安全に記憶されるため、入力は最初の1回だけです。GitHubには一切保存されません。</p>
    
    <label>1. ウェブ API キー (apiKey)</label>
    <input type="text" id="cfg-key" placeholder="AIzaSy...">
    
    <label>2. プロジェクト ID (projectId)</label>
    <input type="text" id="cfg-id" placeholder="enviroment-monitor-xxxxx">
    
    <label>3. データベース URL (databaseURL)</label>
    <input type="text" id="cfg-url" placeholder="https://...firebasedatabase.app">
    
    <button onclick="saveAndConnect()">接続して記憶する</button>
  </div>
</div>

<div class="header-row">
  <div class="filter-box">開始:<input type="datetime-local" id="start"> ～ 終了:<input type="datetime-local" id="end"><button onclick="applyFilter()" style="background:#28a745;color:white;border:none;">適用</button></div>
  <h2>クラウド環境モニター</h2>
  <div class="controls">
    <span id="auth-status" style="font-size:12px; color:#555; margin-right:10px; font-weight:bold;">認証確認中...</span>
    <button id="btn_temp" onclick="changeType('temp')">温度(℃)</button>
    <button id="btn_hum" onclick="changeType('hum')">湿度(%)</button>
    <button id="btn_pres" onclick="changeType('pres')">気圧(hPa)</button>
    <div class="mode-divider"></div>
    <button id="btn_mode_switch" class="btn-toggle-auto" onclick="toggleUpdateMode()">更新モード: 自動</button>
    <button id="btn_manual_fetch" style="background:#28a745;color:#fff;display:none;" onclick="triggerManualFetch()">最新データ読込 ↻</button>
  </div>
</div>
<div id="chart-container"><canvas id="chart"></canvas></div>
<div class="table-outer"><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Time</th><th>Device</th><th>Temp</th><th>Hum</th><th>Pres</th><th>RSSI</th></tr></thead><tbody id="tbl"></tbody></table></div></div>

<script>
let chart = null; let currentType = 'temp'; let fullData = [];
let isAutoMode = true; let refreshIntervalId = null;
const PRESET_COLORS = ['#3498db', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22', '#34495e'];

function parseTS(dStr, tStr) { const d = dStr.split('/'); const t = tStr.split(':'); return new Date(d[0], d[1]-1, d[2], t[0], t[1], t[2]).getTime(); }

// 🚀 画面起動時の処理
window.onload = function() {
  // ブラウザの記憶（LocalStorage）から過去に入力したキーがあるか探す
  const savedKey = localStorage.getItem("env_api_key");
  const savedId = localStorage.getItem("env_proj_id");
  const savedUrl = localStorage.getItem("env_db_url");

  if (savedKey && savedId && savedUrl) {
    // 記憶があれば、入力画面を非表示にして自動接続
    document.getElementById("setup-screen").style.display = "none";
    initFirebase(savedKey, savedId, savedUrl);
  }
};

// 💾 ボタンを押した時にキーをブラウザに記憶して接続する処理
function saveAndConnect() {
  const key = document.getElementById("cfg-key").value.trim();
  const id = document.getElementById("cfg-id").value.trim();
  const url = document.getElementById("cfg-url").value.trim();

  if(!key || !id || !url) { alert("すべての項目を入力してください。"); return; }

  localStorage.setItem("env_api_key", key);
  localStorage.setItem("env_proj_id", id);
  localStorage.setItem("env_db_url", url);

  document.getElementById("setup-screen").style.display = "none";
  initFirebase(key, id, url);
}

// ⚙️ Firebaseの初期化とGoogleログイン処理（Redirect方式でマカフィー回避）
function initFirebase(key, id, url) {
  const firebaseConfig = {
    apiKey: key,
    authDomain: `${id}.firebaseapp.com`,
    projectId: id,
    databaseURL: url
  };
  firebase.initializeApp(firebaseConfig);

// Google認証リダイレクト処理
  firebase.auth().onAuthStateChanged((user) => {
    if (user) {
      console.log("[Auth] ログイン成功:", user.email);
      document.getElementById("auth-status").innerText = `👤 ${user.displayName} (接続済)`;
      document.getElementById("auth-status").style.color = "#28a745";
      loadData(false);     
      startAutoTimer();    
    } else {
      // 🌟【ここを追加】Googleから戻ってきた判定中の場合は、二重でログイン処理を走らせない
      firebase.auth().getRedirectResult().then((result) => {
        if (!result.user && !firebase.auth().currentUser) {
          document.getElementById("auth-status").innerText = "🔒 未認証 (ログイン中...)";
          const provider = new firebase.auth.GoogleAuthProvider();
          firebase.auth().signInWithRedirect(provider);
        }
      }).catch((error) => {
        console.error("[Auth] リダイレクト処理エラー:", error.message);
      });
    }
  });

// （以下、データ読み込みやグラフ描画のロジックは以前のまま維持されます...）
async function loadData(fetchAll = false) {
    if (!firebase.auth().currentUser) return;
    const now = new Date();
    const monthTag = `log_${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}`;
    let dbRef = firebase.database().ref(monthTag);
    if (!fetchAll) dbRef = dbRef.limitToLast(1000);

    try {
        dbRef.once('value', (snapshot) => {
            const json = snapshot.val();
            if(!json) { fullData = []; applyFilter(); return; }
            fullData = Object.values(json).map(d => ({ ...d, _ts: parseTS(d.date, d.time) })).sort((a,b)=>a._ts - b._ts);
            applyFilter();
        });
    } catch(e) { console.error(e); }
}

function applyFilter() {
    const sT = document.getElementById('start').value ? new Date(document.getElementById('start').value).getTime() : 0;
    const eT = document.getElementById('end').value ? new Date(document.getElementById('end').value).getTime() : Infinity;
    let filtered = fullData.filter(d => d._ts >= sT && d._ts <= eT);
    const displayList = filtered.slice(-1000); 
    const tbody = document.getElementById('tbl'); let h = '';
    displayList.slice().reverse().forEach(d => {
        h += `<tr><td>${d.date}</td><td>${d.time}</td><td>${d.device}</td><td>${Number(d.temp).toFixed(2)}</td><td>${Number(d.hum).toFixed(2)}</td><td>${Number(d.pres).toFixed(1)}</td><td>${d.rssi||'-'}</td></tr>`;
    });
    tbody.innerHTML = h;
    updateChart(displayList);
}

function toggleUpdateMode() {
    const switchBtn = document.getElementById('btn_mode_switch');
    const fetchBtn = document.getElementById('btn_manual_fetch');
    if (isAutoMode) {
        isAutoMode = false; switchBtn.innerText = "更新モード: 手動"; fetchBtn.style.display = "inline-block";
        if (refreshIntervalId) { clearInterval(refreshIntervalId); refreshIntervalId = null; }
    } else {
        isAutoMode = true; switchBtn.innerText = "更新モード: 自動"; fetchBtn.style.display = "none";
        loadData(false); startAutoTimer();
    }
}
function triggerManualFetch() { loadData(true); }
function startAutoTimer() {
    if (refreshIntervalId) clearInterval(refreshIntervalId);
    refreshIntervalId = setInterval(() => { if (isAutoMode && firebase.auth().currentUser) loadData(false); }, 60000);
}
function changeType(t){ currentType = t; applyFilter(); }
function updateChart(data) {
    ['temp','hum','pres'].forEach(t => document.getElementById('btn_'+t).className = (t===currentType)?'active':'');
    if(chart) chart.destroy(); if(data.length === 0) return;
    const labelSet = new Set(); const groups = {};
    data.forEach(d => {
        const lbl = d.date.split('/').slice(1).join('/') + " " + d.time.slice(0,5);
        labelSet.add(lbl); if(!groups[d.device]) groups[d.device] = {vals:{}}; groups[d.device].vals[lbl] = d[currentType];
    });
    const labels = Array.from(labelSet); const sortedDevices = Object.keys(groups).sort();
    const datasets = sortedDevices.map((dev, index) => {
        const color = PRESET_COLORS[index % PRESET_COLORS.length];
        return { label: dev, data: labels.map(l => groups[dev].vals[l] || null), borderColor: color, backgroundColor: color, tension: 0.1, spanGaps: true };
    });
    chart = new Chart(document.getElementById('chart'), { type: 'line', data: {labels, datasets}, options: { responsive: true, maintainAspectRatio: false, animation: false } });
}
</script>
</body>
</html>
